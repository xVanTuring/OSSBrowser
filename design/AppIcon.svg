<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- OSSBrowser 图标：线条风格的圆润字母 O（OSS），背景铺一层很淡的二进制字符 -->
  <defs>
    <linearGradient id="g-bg" x1="200" y1="100" x2="824" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9A3D"/>
      <stop offset="1" stop-color="#E8365D"/>
    </linearGradient>
    <filter id="g-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="g-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#7A1030" flood-opacity="0.35"/>
    </filter>
    <clipPath id="g-clip">
      <rect x="100" y="100" width="824" height="824" rx="184"/>
    </clipPath>

    <!-- 特效：顶部高光（上亮下透明） -->
    <linearGradient id="g-sheen" x1="512" y1="100" x2="512" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- 特效：底部压暗 -->
    <linearGradient id="g-dim" x1="512" y1="560" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
    <!-- 特效：边缘亮边（顶部明显、底部几乎没有） -->
    <linearGradient id="g-rim" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <!-- 字母 O：上白下微灰，做出立体感 -->
    <linearGradient id="g-o" x1="512" y1="276" x2="512" y2="748" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EADFE2"/>
    </linearGradient>
  </defs>

  <g filter="url(#g-shadow)">
    <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#g-bg)"/>
  </g>

  <!-- 背景二进制字符：小字号、低不透明度 -->
  <g clip-path="url(#g-clip)" fill="#FFFFFF" fill-opacity="0.10"
     font-family="Menlo, SF Mono, monospace" font-size="26" font-weight="600">
    <text x="96" y="130">0110100101110010100110101100101101001011100101001101</text>
    <text x="88" y="166">1001011010001101011100101001101010110010110100101011</text>
    <text x="104" y="202">0101101001101010010111001011010011010100101101100101</text>
    <text x="92" y="238">1100101011010010110100101101001010110110010100110110</text>
    <text x="96" y="274">0010110101001101011010010110101100100101101011010010</text>
    <text x="84" y="310">1011010010110101001011010101100101101001010110100101</text>
    <text x="100" y="346">0110010110100101101011001010011010110100101101001011</text>
    <text x="90" y="382">1010110100101100101011010010110101001011010110010100</text>
    <text x="98" y="418">0101001011010110100101011010010110100110101001011010</text>
    <text x="86" y="454">1101011001010010110101101001010110100101101011001011</text>
    <text x="102" y="490">0010110101101001011010010101101011001010110100101101</text>
    <text x="92" y="526">1011001010110100101011010110010101101001011010100110</text>
    <text x="96" y="562">0110101101001010110100101101011001011010010110101001</text>
    <text x="84" y="598">1001010110101101001011010100101101011010010101101010</text>
    <text x="100" y="634">0101101010010110101001011010110100101011010010110101</text>
    <text x="90" y="670">1100101101011001010110100101101010010110101101001011</text>
    <text x="98" y="706">0011010010110101101001010110100101101010110010110100</text>
    <text x="86" y="742">1010010110100101011010110100101101001011010100101101</text>
    <text x="102" y="778">0101101011001011010010110101001011010110100101101010</text>
    <text x="92" y="814">1101001010110101001011010110100101010110100101101001</text>
    <text x="96" y="850">0010110100101101011010010101101001011010101101001011</text>
    <text x="84" y="886">1011010110100101001011010110100101101010010110101100</text>
    <text x="100" y="922">0110100101011010110100101101001011010100101101011010</text>
  </g>

  <!-- 背景特效：顶部高光 + 底部压暗 -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#g-sheen)"/>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#g-dim)"/>

  <!-- 字母 O：线条风格、略高于宽，显得圆润；上白下微灰 + 下方阴影做出立体感 -->
  <g filter="url(#g-soft)">
    <ellipse cx="512" cy="512" rx="214" ry="236" fill="none" stroke="url(#g-o)" stroke-width="64"/>
  </g>

  <!-- 边缘亮边 -->
  <rect x="102" y="102" width="820" height="820" rx="182" fill="none" stroke="url(#g-rim)" stroke-width="4"/>
</svg>
